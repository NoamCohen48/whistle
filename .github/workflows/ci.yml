---
name: CI

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs the same checks before it builds anything.
  workflow_call:

# Pull request code never gets a write token.
permissions:
  contents: read

concurrency:
  group: whistle-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate, test and package
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CI: 'true'
      # The opt-in real-pane integration test stays off; nothing reaches a real Herdr.
      WHISTLE_TEST_PANE: ''
      HERDR_SOCKET_PATH: /tmp/whistle-ci-no-real-herdr.sock
      WHISTLE_HERDR_BIN: /bin/false
      HOST: 127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node for Vite and Playwright tooling
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Python for VM harness unit tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install browser and namespace test dependencies
        run: |
          bunx playwright install --with-deps chromium
          sudo apt-get install --no-install-recommends -y bubblewrap

      - name: Typecheck
        run: bun run typecheck

      - name: Build app assets for host fixtures
        run: bun run build

      - name: Unit and fake-host API tests
        run: bun test

      - name: VM harness unit tests (no VMs)
        run: bun run test:vm:unit

      - name: Browser tests against the fake host
        run: bun run test:e2e

      - name: Build and test the website
        run: bun run test:site

      - name: Build and test the standalone executable
        run: bun run test:package

      - name: Upload browser traces
        if: failure()
        # actions/upload-artifact v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-traces-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
