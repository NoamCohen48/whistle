---
name: CI and Pages

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# PR code never gets a write token. Only the trusted Pages job can deploy.
permissions:
  contents: read

concurrency:
  group: whistle-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR checks, but never interrupt an active main deployment.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate, test and package
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CI: 'true'
      # Explicitly disable the opt-in real-pane integration test.
      POC_TEST_PANE: ''
      HERDR_SOCKET_PATH: /tmp/whistle-ci-no-real-herdr.sock
      WHISTLE_HERDR_BIN: /bin/false
      HOST: 127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node for Vite and Playwright tooling
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Python for VM harness unit tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Prepare isolated unit-parser runtime
        run: |
          runtime="$RUNNER_TEMP/whistle-unit-runtime"
          install -d -m 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install browser and namespace test dependencies
        run: |
          bunx playwright install --with-deps chromium
          sudo apt-get install --no-install-recommends -y bubblewrap

      - name: Typecheck
        run: bun run typecheck

      - name: Build private app assets for host fixtures
        run: bun run build

      - name: Unit and fake-host API tests
        run: bun test

      - name: VM harness unit tests (no VMs)
        run: bun run test:vm:unit

      - name: Build and test private app against fake server
        run: bun run test:e2e

      - name: Build and test public site
        run: bun run test:site

      - name: Build and validate standalone Linux executable
        run: bun run test:package

      - name: Archive verified executable
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request'
        run: |
          (cd dist && sha256sum --check whistle.sha256)
          tar -czf dist/whistle-linux-x64.tar.gz -C dist whistle whistle.sha256
          (cd dist && sha256sum whistle-linux-x64.tar.gz \
            > whistle-linux-x64.tar.gz.sha256)

      - name: Upload Linux build
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request'
        # actions/upload-artifact v7 (Node 24)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: whistle-linux-x64-${{ github.sha }}
          path: |
            dist/whistle-linux-x64.tar.gz
            dist/whistle-linux-x64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload public Pages site only
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request'
        # actions/upload-pages-artifact v4
        uses: >-
          actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site-dist
          retention-days: 1

      - name: Upload fake-test failure traces
        if: failure()
        # actions/upload-artifact v7 (Node 24)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fake-test-traces-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  pages:
    name: Publish public landing page
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        # actions/configure-pages v5
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
