name: Android

# The phone tests in tests/android, on an Android emulator: real taps, the real Android keyboard
# and the real Chrome app. Kept out of ci.yml so the release workflow does not wait on an
# emulator, and not a required check, since emulators on hosted runners occasionally fail to boot.
'on':
  pull_request:
    paths: ['web/**', 'shared/**', 'tests/android/**', 'tests/e2e/fixture-server.ts', 'package.json', 'bun.lock', '.github/workflows/android.yml']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whistle-android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  emulator:
    name: Phone tests on an Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node for Vite and Playwright tooling
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build the app
        run: bun run build

      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Phone tests on the emulator
        # reactivecircus/android-emulator-runner v2.38.0
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          # Show the on-screen keyboard even though the emulator also offers a hardware one.
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            bunx playwright test --config tests/android/playwright.config.ts

      - name: Upload traces
        if: failure()
        # actions/upload-artifact v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-traces-${{ github.run_attempt }}
          path: test-results/android/
          if-no-files-found: ignore
          retention-days: 7
