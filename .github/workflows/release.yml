---
name: Release

# Releases whenever main has a package.json version that has no release yet:
# bump the version, add its CHANGELOG.md section, and merge.
'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whistle-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NFPM_VERSION: 2.47.0
  NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783

jobs:
  version:
    name: Check for a new version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Compare package.json with the published releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are made from main only, not $GITHUB_REF"
            exit 1
          fi
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Whistle $version is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -q "^## $version " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "Releasing Whistle $version."
          echo "release=true" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build downloads
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install nfpm
        run: |
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$archive"
          echo "$NFPM_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" nfpm
          echo "NFPM=$RUNNER_TEMP/nfpm" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build x64 and arm64 downloads
        run: bun run release

      - name: Set up arm64 emulation for package checks
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Install each package on its distribution
        run: |
          check() {
            echo "::group::$1 on $2 ($3)"
            docker run --rm --platform "$3" -v "$PWD/dist/release:/r:ro" "$2" sh -euc "$4 && whistle --version"
            echo '::endgroup::'
          }
          for platform in linux/amd64 linux/arm64; do
            deb=$([ "$platform" = linux/amd64 ] && echo amd64 || echo arm64)
            rpm=$([ "$platform" = linux/amd64 ] && echo x86_64 || echo aarch64)
            check "whistle_$deb.deb" debian:stable-slim "$platform" \
              "apt-get update -qq && apt-get install -y -qq /r/whistle_$deb.deb"
            check "whistle_$deb.deb" ubuntu:24.04 "$platform" \
              "apt-get update -qq && apt-get install -y -qq /r/whistle_$deb.deb"
            check "whistle.$rpm.rpm" fedora:latest "$platform" \
              "dnf install -y -q /r/whistle.$rpm.rpm"
            check "whistle-linux-${deb/amd64/x64}.tar.gz" debian:stable-slim "$platform" \
              "tar -xzf /r/whistle-linux-${deb/amd64/x64}.tar.gz -C /tmp && ln -s /tmp/whistle-*/whistle /usr/local/bin/whistle"
          done
          # Arch Linux publishes x86_64 images only.
          check whistle-x86_64.pkg.tar.zst archlinux:latest linux/amd64 \
            "pacman -U --noconfirm /r/whistle-x86_64.pkg.tar.zst"
          (cd dist/release && sha256sum --check SHA256SUMS)
          sh -n dist/release/install.sh

      - name: Keep the downloads for publishing
        # actions/upload-artifact v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Keep the AUR package files
        # actions/upload-artifact v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aur
          path: dist/aur/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub release
    needs: [version, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download the built files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release

      - name: Record build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/release/SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          version="$RELEASE_VERSION"
          # Release notes are this version's CHANGELOG.md section.
          awk -v heading="## $version " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<EOF

          ## Install

          \`\`\`sh
          curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh
          \`\`\`

          Or download a package below. Check downloads with \`sha256sum --check --ignore-missing SHA256SUMS\`, and
          their build provenance with \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`.
          EOF
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
          # Creates the v$version tag on the commit that was built.
          gh release create "v$version" dist/release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Whistle $version" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"

  aur:
    name: Update the AUR package
    needs: [version, publish]
    # Off for now: Whistle is not published to the AUR yet. Remove this line to turn it on.
    if: false
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Download the AUR package files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aur
          path: dist/aur

      - name: Build and install it on Arch Linux from the published release
        run: |
          docker run --rm -v "$PWD/dist/aur:/aur:ro" archlinux:latest bash -euc '
            pacman -Syu --noconfirm --needed base-devel >/dev/null
            useradd -m builder
            cp -r /aur /home/builder/package && chown -R builder /home/builder/package
            su builder -c "cd /home/builder/package && makepkg --noconfirm"
            pacman -U --noconfirm /home/builder/package/whistle-herdr-bin-*.pkg.tar.zst
            whistle --version'

      - name: Push to the AUR
        # Skipped, with a notice, until an AUR_SSH_KEY secret holds the AUR account's private key.
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::notice::No AUR_SSH_KEY secret, so the AUR package was checked but not pushed."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          # The AUR's published host key fingerprint.
          ssh-keyscan -t ed25519 aur.archlinux.org > "$RUNNER_TEMP/aur-host" 2>/dev/null
          ssh-keygen -lf "$RUNNER_TEMP/aur-host" | grep -q 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
          cat "$RUNNER_TEMP/aur-host" >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes'
          git clone ssh://aur@aur.archlinux.org/whistle-herdr-bin.git "$RUNNER_TEMP/aur"
          cp dist/aur/PKGBUILD dist/aur/.SRCINFO "$RUNNER_TEMP/aur/"
          cd "$RUNNER_TEMP/aur"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo "The AUR already has $RELEASE_VERSION."; exit 0; fi
          git -c user.name='Noam Cohen' -c user.email='92931230+NoamCohen48@users.noreply.github.com' \
            commit -q -m "Update to $RELEASE_VERSION"
          git push origin HEAD:master

  site:
    name: Build the website
    needs: publish
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Build the website for this release
        run: |
          bun install --frozen-lockfile
          bun run build:site

      - name: Upload the website
        # actions/upload-pages-artifact v4
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site-dist
          retention-days: 1

  pages:
    name: Publish the website
    needs: site
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        # actions/configure-pages v5
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
